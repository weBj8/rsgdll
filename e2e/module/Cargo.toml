[package]
name = "rsgdll-e2e"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
crash-test = []

[lib]
crate-type = ["cdylib"]

[dependencies]
rsgdll = { path = "../../crates/rsgdll", features = ["async", "backtrace", "debug", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
rsgdll = { path = "../../crates/rsgdll", features = ["engine"] }

[workspace]
