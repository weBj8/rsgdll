services:
  runner:
    container_name: ${RSGDLL_E2E_CONTAINER_NAME}
    restart: "no"
    entrypoint: ["/bin/bash", "/home/steam/rsgdll-entrypoint.sh"]
    environment:
      RSGDLL_E2E_CLOSE_MARKER: /e2e-artifacts/close-hook.txt
      RSGDLL_E2E_MODULE_SUFFIX: ${RSGDLL_E2E_MODULE_SUFFIX}
      RSGDLL_E2E_SERVER_BINARY: ${RSGDLL_E2E_SERVER_BINARY}
    ulimits:
      core:
        soft: -1
        hard: -1
    volumes:
      - type: bind
        source: ${RSGDLL_E2E_ENTRYPOINT}
        target: /home/steam/rsgdll-entrypoint.sh
        read_only: true
      - type: bind
        source: ${E2E_ARTIFACT_DIR}
        target: /e2e-artifacts
