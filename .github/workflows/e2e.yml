name: Garry's Mod E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux32:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build Linux32 Rust image
        run: |
          docker build \
            --file e2e/linux32-build.Dockerfile \
            --tag rsgdll-e2e-linux32-build \
            .

      - name: Run real Linux32 GLuaTest server
        env:
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts-linux32
          RSGDLL_E2E_BUILD_IMAGE: rsgdll-e2e-linux32-build
          RSGDLL_E2E_TARGET: i686-unknown-linux-gnu
        run: bash e2e/run.sh

      - name: Upload Linux32 E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rsgdll-e2e-linux32
          path: e2e-artifacts-linux32/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

  linux64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Enable core dumps
        run: |
          ulimit -c unlimited
          printf 'core.%%e.%%p.%%t\n' | sudo tee /proc/sys/kernel/core_pattern

      - name: Run real GLuaTest server
        env:
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
        run: bash e2e/run.sh

      - name: Verify native crash diagnostics
        env:
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts-crash
          RSGDLL_E2E_CRASH_TEST: "1"
          RSGDLL_E2E_EXPECTED_OUTCOME: SERVER_CRASH
        run: bash e2e/run.sh

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rsgdll-e2e-linux64
          path: |
            e2e-artifacts/
            e2e-artifacts-crash/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
