# rsgdll CI (spec §12). Windows targets are not released without a green Windows srcds run:
# it is the only check of MSVC vtable slot order and thiscall.
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Stock LuaJIT for runtime tests
        run: sudo apt-get update && sudo apt-get install -y libluajit-5.1-2
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo test -p rsgdll --features server --test ui
      - run: cargo clippy -p rsgdll-core -- -D warnings

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux, linux64, win32, win64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu,x86_64-unknown-linux-gnu,i686-pc-windows-msvc,x86_64-pc-windows-msvc
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: cargo install cargo-zigbuild --version 0.20.1 --locked && cargo install cargo-xwin --locked
      - run: cargo xtask build --target ${{ matrix.target }} --realm sv -p minimal --release
      - uses: actions/upload-artifact@v4
        with:
          name: gmsv_minimal_${{ matrix.target }}
          path: target/gmod/*.dll

  # xtask test-srcds only drives linux64 (Platform::Linux64 + srcds_run_x64); other branches
  # need harness support before they get a job here.
  srcds-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache srcds
        uses: actions/cache@v4
        with:
          path: ~/srcds
          key: srcds-gmod-linux64
      - name: Install Garry's Mod dedicated server (SteamCMD app 4020)
        run: |
          sudo dpkg --add-architecture i386 && sudo apt-get update
          echo steam steam/question select "I AGREE" | sudo debconf-set-selections
          echo steam steam/license note '' | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y lib32gcc-s1 steamcmd
          # first app_update after steamcmd self-update often fails with "Missing configuration"
          for i in 1 2 3; do
            /usr/games/steamcmd +force_install_dir "$HOME/srcds" +login anonymous +app_update 4020 -beta x86-64 validate +quit && break
            [ "$i" = 3 ] && exit 1; sleep 5
          done
          test -x "$HOME/srcds/srcds_run_x64"
      - name: test-srcds
        run: RSGDLL_SRCDS_DIR="$HOME/srcds" cargo xtask test-srcds
