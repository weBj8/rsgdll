[workspace]
resolver = "3"
members = ["crates/*", "xtask", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rsgdll = { path = "crates/rsgdll" }
rsgdll-sys = { path = "crates/rsgdll-sys" }
rsgdll-core = { path = "crates/rsgdll-core" }
rsgdll-macros = { path = "crates/rsgdll-macros" }
rsgdll-luacheck = { path = "crates/rsgdll-luacheck" }
rsgdll-apidb = { path = "crates/rsgdll-apidb" }
rsgdll-gmod = { path = "crates/rsgdll-gmod" }
libloading = "=0.9.0"
linkme = "=0.3.37"
syn = { version = "=2.0.119", features = ["full"] }
quote = "=1.0.47"
proc-macro2 = "=1.0.107"
trybuild = "=1.0.122"
serde = "=1.0.229"
async-task = "=4.7.1"
tokio = "=1.54.0"
indexmap = "=2.14.2"
toml = "=1.1.8"

[profile.release]
debug = "line-tables-only"
panic = "unwind"
